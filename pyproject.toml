[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cctvgpt"
version = "0.1.0"
description = "Prompt-based synthetic CCTV-style video generation with built-in provenance safeguards (VidyuthLabs AI vertical, Phase 1 feasibility build)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Forensic search models (CPU builds of torch work; install torch from the PyTorch index for CPU-only machines).
search = ["torch>=2.2", "torchvision>=0.17", "open_clip_torch>=2.24", "pillow>=10", "transformers>=4.40", "sentencepiece>=0.2",
          "huggingface_hub>=0.23", "fast-plate-ocr[onnx]>=1.0"]
# Optional: IndicTrans2 query translation (gated weights; see docs/SEARCH.md)
indic = ["IndicTransToolkit>=1.0"]
bench = ["scikit-learn>=1.4", "pandas>=2", "pyarrow>=15"]

[project.scripts]
cctvgpt = "cctvgpt.cli:main"

[tool.setuptools.packages.find]
include = ["cctvgpt*"]

[tool.setuptools.package-data]
"cctvgpt" = ["api/static/*", "safeguards/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
