[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cctvgpt"
version = "0.1.0"
description = "Prompt-based synthetic CCTV-style video generation with built-in provenance safeguards (VidyuthLabs AI vertical, Phase 1 feasibility build)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cctvgpt = "cctvgpt.cli:main"

[tool.setuptools.packages.find]
include = ["cctvgpt*"]

[tool.setuptools.package-data]
"cctvgpt" = ["api/static/*", "safeguards/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
